[project]
name = "llmstart-aidd-bot"
version = "0.1.0"
description = "Telegram LLM-ассистент"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "python-dotenv>=1,<2",
]

[project.scripts]
bot = "bot.main:run"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
